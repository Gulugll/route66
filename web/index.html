<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>路线规划器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, "PingFang SC", sans-serif; height: 100vh; display: flex; flex-direction: column; color: #222; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #f7f7f7; border-bottom: 1px solid #e0e0e0; }
  header h1 { font-size: 18px; }
  #settingsBtn { padding: 6px 14px; border: 1px solid #ccc; border-radius: 6px; background: #fff; font-size: 13px; }
  main { flex: 1; display: flex; min-height: 0; }

  /* 左:控制面板 */
  #panel { width: 330px; padding: 16px; overflow-y: auto; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; gap: 12px; }
  #panel h2 { font-size: 14px; color: #555; }
  #pointList { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  #pointList li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: #f2f6ff; border: 1px solid #d6e0f5; border-radius: 6px; font-size: 13px; cursor: grab; }
  #pointList li.dragging { opacity: .4; border-style: dashed; }
  #pointList li.drag-over { border-color: #1a73e8; background: #e8f0fe; }
  #pointList li .badge { flex-shrink: 0; font-size: 11px; color: #1a73e8; background: #e8f0fe; padding: 1px 6px; border-radius: 10px; }
  #pointList li .coords { color: #888; font-size: 11px; margin-left: auto; }
  #pointList li button { border: none; background: none; color: #d93025; cursor: pointer; font-size: 13px; }
  /* 每段出行方式:放在两个地点之间,视觉上是连接线 */
  #pointList .leg-connector { display: flex; align-items: center; gap: 6px; padding: 1px 8px; font-size: 11px; color: #888; }
  #pointList .leg-connector::before, #pointList .leg-connector::after { content: ''; flex: 1; height: 1px; background: #d8d8d8; }
  #pointList .leg-connector .leg-btn { padding: 1px 7px; border: 1px solid #ddd; border-radius: 4px; background: #fff; font-size: 12px; cursor: pointer; }
  #pointList .leg-connector .leg-btn.active { background: #1a73e8; border-color: #1a73e8; }
  #planOptions { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: #fafafa; border: 1px solid #eee; border-radius: 6px; }
  #planOptions label { font-size: 13px; color: #555; }
  /* 分段按钮组:替代原生 select,选项少时按钮比下拉好看、好点 */
  #modeGroup { display: flex; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
  #modeGroup .mode-btn { flex: 1; padding: 8px 0; border: none; background: #fff; font-size: 13px; cursor: pointer; transition: background .15s; }
  #modeGroup .mode-btn + .mode-btn { border-left: 1px solid #ccc; }
  #modeGroup .mode-btn.active { background: #1a73e8; color: #fff; }
  #manualLabel { display: flex; align-items: center; gap: 6px; }
  #addForm { display: flex; flex-direction: column; gap: 6px; }
  #addForm input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  #addBtn { padding: 8px; border: 1px solid #ccc; border-radius: 6px; background: #fff; font-size: 13px; }
  #searchForm { display: flex; gap: 6px; }
  #searchForm input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  #searchBtn { padding: 8px 14px; border: none; border-radius: 6px; background: #1a73e8; color: #fff; font-size: 13px; }
  #cityInput { padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 12px; color: #555; }
  #searchResults { list-style: none; display: flex; flex-direction: column; gap: 4px; }
  #searchResults li { padding: 6px 8px; background: #fff; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; cursor: pointer; }
  #searchResults li:hover { background: #e8f0fe; }
  #searchResults li .addr { color: #888; font-size: 11px; }
  #manualForm { border: 1px solid #eee; border-radius: 6px; padding: 8px; }
  #manualForm summary { font-size: 12px; color: #888; cursor: pointer; }
  #planBtn { padding: 10px; border: none; border-radius: 6px; background: #1a73e8; color: #fff; font-size: 14px; }
  #result { font-size: 13px; line-height: 1.8; background: #fafafa; padding: 10px; border-radius: 6px; border: 1px solid #eee; }
  #result:empty { display: none; }
  #result b { color: #1a73e8; }

  /* 右:地图 */
  #map { flex: 1; position: relative; background: #fafafa; }
  #mapHint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: #888; font-size: 14px; line-height: 1.8; }
  .hidden { display: none !important; }

  /* 图例:每种出行方式一种颜色 */
  #legend { position: absolute; top: 10px; right: 10px; z-index: 10; background: rgba(255,255,255,.92); border: 1px solid #ddd; border-radius: 8px; padding: 8px 12px; font-size: 12px; display: flex; flex-direction: column; gap: 5px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  #legend span { display: flex; align-items: center; gap: 7px; }
  #legend i { width: 22px; height: 4px; border-radius: 2px; display: inline-block; }

  /* 设置弹层 */
  #settingsOverlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; }
  #settingsBox { width: 380px; background: #fff; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  #settingsBox h2 { font-size: 16px; }
  #settingsBox label { font-size: 13px; color: #555; }
  #settingsBox input { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  #settingsBox .hint { font-size: 12px; color: #888; line-height: 1.6; }
  #settingsBox .row { display: flex; gap: 8px; }
  #settingsBox .row button { flex: 1; padding: 8px; border-radius: 6px; font-size: 13px; }
  #saveKeyBtn { border: none; background: #1a73e8; color: #fff; }
  #closeSettingsBtn { border: 1px solid #ccc; background: #fff; }
</style>
</head>
<body>
<header>
  <h1>🗺️ 路线规划器</h1>
  <button id="settingsBtn">设置</button>
</header>

<main>
  <section id="panel">
    <h2>🔍 搜索添加地点</h2>
    <div id="searchForm">
      <input id="searchInput" placeholder="输入地名,如 广州塔">
      <button id="searchBtn">搜索</button>
    </div>
    <input id="cityInput" placeholder="城市(可选,留空=全国搜索,如 杭州)">
    <ul id="searchResults"></ul>

    <h2>地点列表(第 1 个是起点,可拖拽排序)</h2>
    <ul id="pointList"></ul>

    <div id="planOptions">
      <label id="manualLabel"><input type="checkbox" id="manualCheck" checked> 手动设置每段出行方式(默认,取消则自动优化顺序)</label>
    </div>

    <details id="manualForm">
      <summary>或手动输入坐标(高级)</summary>
      <div id="addForm">
        <input id="nameInput" placeholder="名称,如 广州塔">
        <input id="latInput" placeholder="纬度,如 23.1066">
        <input id="lngInput" placeholder="经度,如 113.3245">
        <button id="addBtn">➕ 添加</button>
      </div>
    </details>

    <button id="planBtn">🚀 开始规划</button>
    <div id="result"></div>
  </section>

  <div id="map">
    <div id="mapHint">未配置高德 JS key,当前用手动输入选点。<br>点右上角「设置」填入你自己的 key,即可搜索地名 + 点选地图。</div>
    <div id="legend" class="hidden">
      <span><i style="background:#1a73e8"></i>🚗 驾车</span>
      <span><i style="background:#34a853"></i>🚶 步行</span>
      <span><i style="background:#f9a825"></i>🚌 公交</span>
    </div>
  </div>
</main>

<!-- 设置弹层:key 由使用者自己配置(开源),存浏览器本地,不进代码仓库 -->
<div id="settingsOverlay" class="hidden">
  <div id="settingsBox">
    <h2>设置</h2>
    <label for="keyInput">高德 JS API Key</label>
    <input id="keyInput" placeholder="粘贴你的 JS key">
    <label for="jscodeInput">安全密钥(可选)</label>
    <input id="jscodeInput" placeholder="控制台开了「安全密钥」才需要填">
    <p class="hint">这是开源项目,key 由使用者自己申请配置。<br>
      申请时把当前域名加入白名单(localhost 可不填);<br>
      若在控制台开启了「安全密钥」,把 jscode 也填上。</p>
    <div class="row">
      <button id="saveKeyBtn">保存并重载地图</button>
      <button id="closeSettingsBtn">取消</button>
    </div>
  </div>
</div>

<!-- SortableJS 拖拽库:本地托管(web/vendor),不依赖 CDN——
     避免浏览器跟踪防护(Tracking Prevention)拦截外部脚本/存储 -->
<script src="vendor/sortable.min.js"></script>
<!-- app.js?v=... 是"缓存破坏":改前端代码后 bump 版本号,
     浏览器才会重新下载,而不是用缓存的旧文件。
     生产上常用 hash(如 app.a1b2c3.js)代替手写版本号。 -->
<script src="app.js?v=20260820i"></script>
</body>
</html>
